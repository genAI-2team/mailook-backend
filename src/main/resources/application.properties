spring.application.name=mailook-backend

## 서버 포트
server.port=8080

# JWT signing key from the system environment
jwt.secret=${JWT_SECRET}

## 터미널 칼라 출력
spring.output.ansi.enabled=ALWAYS

## 로깅
logging.pattern.console=%clr(%-5level){green} %clr(%logger{15}.%M\\(\\)){cyan}: %msg %n

## DB 설정
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/mailook
spring.datasource.username=${DB_MAILOOK_NAME}
spring.datasource.password=${DB_MAILOOK_PASSWORD}

## MyBatis 설정
mybatis.config-location=classpath:mapper/mybatis_config.xml
mybatis.mapper-locations=classpath:mapper/*/*.xml

## entity를 자동 alias로 등록
mybatis.type-aliases-package=com.mailook.*.entity

## OpenAI API Key
spring.ai.openai.api-key=${OPENAI_API_KEY}