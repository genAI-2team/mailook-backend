name: CI & Branch Check

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      # 1. main으로 가는 PR일 경우 출발 브랜치가 develop인지 검사
      - name: Verify source branch is develop
        if: github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "❌ 오류: main 브랜치로는 오직 'develop' 브랜치에서만 PR을 병합할 수 있습니다."
            echo "현재 시도한 브랜치: ${{ github.head_ref }}"
            exit 1
          fi
          echo "✅ 통과: develop 브랜치에서 생성된 PR입니다."

      # 2. 최신 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. Java 환경 세팅 (프로젝트 Java 버전에 맞게 17 또는 21로 수정)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. Gradle 실행 권한 부여 (리눅스 환경 필수!)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 빌드 및 테스트 실행 (캐시 적용으로 속도 향상)
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build -x test

